<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fast Hands Monitor</title>
<style>
:root{color-scheme:dark;--bg:#071018;--card:#0d1822;--line:#203445;--text:#e9f2f7;--muted:#8ca7b8;--ok:#54d695;--warn:#f1c75b;--bad:#ff6b75}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,Segoe UI,sans-serif}.wrap{max-width:780px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:800;letter-spacing:.08em}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kv{display:grid;grid-template-columns:110px 1fr;gap:7px}.badge{padding:4px 8px;border-radius:999px;border:1px solid var(--line)}button,textarea{border:1px solid var(--line);background:#09131c;color:var(--text);border-radius:9px;padding:9px}button{cursor:pointer}.controls{display:flex;gap:8px;flex-wrap:wrap}.run{border-color:#236342}.pause{border-color:#8a6b21}.stop{border-color:#85333a}.chat{height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:9px;margin-top:9px}.msg{margin:7px 0}.msg.operator{text-align:right}.bubble{display:inline-block;max-width:88%;text-align:left;padding:8px 10px;border-radius:10px;background:#102231}.assistant .bubble{background:#13271f}.meta{display:block;color:var(--muted);font-size:10px;margin-top:4px}.compose{display:flex;gap:8px;margin-top:8px}.compose textarea{flex:1;min-height:62px}.log{max-height:220px;overflow:auto;white-space:pre-wrap;font-family:Consolas,monospace;font-size:11px}.wide{grid-column:1/-1}@media(max-width:640px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head><body><div class="wrap">
<div class="top"><div><div class="title">FAST HANDS // OPERATOR CONSOLE</div><div class="sub">Safe-point control, durable checkpoints and operator messages</div></div><span id="daemon" class="badge">...</span></div>
<div class="grid">
<div class="card"><div class="kv"><b>Status</b><span id="status">-</span><b>Run</b><span id="runId">-</span><b>Step</b><span id="step">-</span><b>Safe point</b><span id="safePoint">-</span></div></div>
<div class="card"><b>Operator control</b><div class="controls" style="margin-top:10px"><button class="run" onclick="control('RUN')">RUN / RESUME</button><button class="pause" onclick="control('PAUSE')">PAUSE</button><button class="stop" onclick="control('STOP')">EMERGENCY STOP</button></div><div class="muted" id="detail" style="margin-top:10px">-</div></div>
<div class="card wide"><b>Operator chat</b><div class="muted">Messages can interrupt an active run at the next safe checkpoint.</div><div id="chat" class="chat"></div><div class="compose"><textarea id="message" placeholder="Correction, instruction or note..."></textarea><button onclick="sendMessage()">Send</button></div><label class="muted"><input id="interrupt" type="checkbox" checked> interrupt active run at next safe point</label></div>
<div class="card wide"><b>Recent events</b><div id="events" class="log"></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(path,opt={}){const r=await fetch(path,opt);return await r.json()}
async function control(mode){await api('/api/control',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode})});await refresh()}
async function sendMessage(){const text=$('message').value.trim();if(!text)return;await api('/api/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,interrupt:$('interrupt').checked})});$('message').value='';await refresh()}
function chat(s){const rows=[];(s.inbox||[]).forEach(m=>rows.push({at:m.at,who:'operator',text:m.text,interrupt:m.interrupt}));(s.outbox||[]).forEach(m=>rows.push({at:m.at,who:'assistant',text:m.text}));rows.sort((a,b)=>new Date(a.at)-new Date(b.at));$('chat').innerHTML=rows.slice(-80).map(m=>`<div class="msg ${m.who}"><span class="bubble">${esc(m.text)}<span class="meta">${m.who.toUpperCase()} · ${new Date(m.at).toLocaleTimeString()}${m.interrupt?' · SAFE-POINT INTERRUPT':''}</span></span></div>`).join('');$('chat').scrollTop=$('chat').scrollHeight}
async function refresh(){try{const s=await api('/api/state');const x=s.execution||{};$('status').textContent=x.status||'IDLE';$('runId').textContent=x.runId||'-';$('step').textContent=x.stepIndex==null?'-':`${Number(x.stepIndex)+1} / ${x.totalSteps??'?'}`;$('safePoint').textContent=x.safePoint||'-';$('detail').textContent=x.detail||'-';const age=s.heartbeat?.at?Date.now()-new Date(s.heartbeat.at).getTime():999999;$('daemon').textContent=age<3000?'MONITOR ONLINE':'MONITOR OFFLINE';chat(s);$('events').textContent=(s.events||[]).slice().reverse().map(e=>`${e.at||''}  ${e.type||''}  ${e.message||''}`).join('\n')}catch(e){$('daemon').textContent='MONITOR ERROR'}}
setInterval(refresh,1000);refresh();
</script></body></html>
