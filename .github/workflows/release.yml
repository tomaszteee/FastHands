name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Verify PowerShell 7
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify exact tag/version
        run: node scripts/verify-release-tag.mjs
      - name: Platform regression
        run: |
          npm run check
          npm test
          npm run audit:repo
          npm audit --audit-level=high
          npm run pack:check

  release:
    needs: verify-platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify exact tag/version
        run: node scripts/verify-release-tag.mjs
      - name: Research dependency gate
        run: |
          python -m pip install -r requirements-research.txt
          python -m pip check
          python -c "import ddgs, trafilatura, requests, playwright, yt_dlp, faster_whisper; print('research-imports-ok')"
      - name: Build npm-compatible source archive
        run: |
          mkdir -p dist/release
          npm pack --pack-destination dist/release
      - name: Export SPDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" --jq '.sbom' > "dist/release/fast-hands-${GITHUB_REF_NAME}-sbom.spdx.json"
      - name: Generate SHA-256 checksums
        run: |
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.tgz
            dist/release/*-sbom.spdx.json
            dist/release/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Fast Hands $GITHUB_REF_NAME" --generate-notes --latest
