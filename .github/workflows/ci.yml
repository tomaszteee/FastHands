name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install metadata only
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: Repository privacy audit
        run: npm run audit:repo
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Python source compile
        run: python -m py_compile integrations/fastweb/fast_web.py integrations/youtube/research.py integrations/youtube/transcript_helper.py
      - name: Package dry run
        run: npm run pack:check

  research-deps:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install optional research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Import research stack
        run: python -c "import ddgs, trafilatura, requests, playwright, yt_dlp, faster_whisper; print('research-imports-ok')"
      - name: Compile bundled research sources
        run: python -m py_compile integrations/fastweb/fast_web.py integrations/youtube/research.py integrations/youtube/transcript_helper.py
